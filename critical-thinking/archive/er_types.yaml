entity_types:
  # Basic building blocks of critical thinking
  - Question: "A prompt or inquiry driving the reasoning process."
  - Answer: "A response or solution to a question."
  - Fact: "A verifiable piece of information."
  - Opinion: "A subjective perspective or belief."
  - Claim: "An assertion requiring evidence."
  - Evidence: "Information that supports or refutes a claim."
  - Assumption: "An unstated premise or belief."
  - Counterargument: "An opposing viewpoint or challenge."
  - Reference: "A source or citation of information."
  - Topic: "A subject area under discussion."
  - Subtopic: "A more specific area within a topic."
  - Context: "Background information or setting."
  - Inference: "A logical conclusion based on evidence."
  - Premise: "A foundational statement used in reasoning."
  - Connection: "A relationship or link between ideas."
  - Bias: "A prejudice that may influence judgment."
  - Conclusion: "The final synthesized understanding."
  - Methodology: "The structured approach to analysis."
  - Criteria: "Standards used to evaluate claims."
  - Fallacy: "An error in reasoning."
  - Weight: "A measure of the strength of evidence."
  - Insight: "A deep understanding gained through analysis."
  - Audience: "The intended recipients of reasoning."
  - Stakeholder: "An entity with an interest in the topic."
  - TemporalContext: "Time-based factors affecting reasoning."

relationship_types:
  - supports: "Indicates that one entity provides support for another."
  - challenges: "Indicates that one entity opposes or questions another."
  - underlies: "Indicates a foundational or underlying relationship."
  - sources: "Indicates the source or origin of information."
  - evaluates: "Indicates that one entity assesses another."
  - connects_to: "Indicates a general connection between entities."